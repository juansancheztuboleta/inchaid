dependencies {
    debugImplementation 'io.tixngo.sdk:flutter_debug:4.2625.3'
    releaseImplementation 'io.tixngo.sdk:flutter_release:4.2625.3'
    debugImplementation 'io.tixngo.sdkUtils:sdkUtils-debug:4.2625.3'
    releaseImplementation 'io.tixngo.sdkUtils:sdkUtils-release:4.2625.3'
}

android {
    namespace = "com.tuboleta.santafepassapp"

    defaultConfig {
        applicationId = "com.tuboleta.santafepassapp"
